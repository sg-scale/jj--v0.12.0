name: Update nix flake.lock
on:
  workflow_dispatch: # allows manual triggering
  schedule:
    - cron: '40 3 * * 0' # runs weekly on Sunday at 03:40

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3
        with:
          pr-title: "nix: update flake.lock"
          pr-assignees: thoughtpolice
          pr-reviewers: thoughtpolice
          pr-labels: |
            dependencies
